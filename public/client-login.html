<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logiclic — Mi Casillero</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1420;
      --bg-gradient: radial-gradient(circle at top right, rgba(14, 165, 233, 0.15), transparent 400px),
                    radial-gradient(circle at bottom left, rgba(26, 127, 232, 0.1), transparent 450px);
      --card: rgba(30, 41, 59, 0.7);
      --border: rgba(14, 165, 233, 0.2);
      --blue: #1a7fe8;
      --blue-glow: rgba(14, 165, 233, 0.4);
      --text: #e8edf5;
      --text-muted: #94a3b8;
      --error: #f43f5e;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
    }

    body {
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(14, 165, 233, 0.15);
      position: relative;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo-icon {
      width: 52px;
      height: 52px;
      display: block;
      margin: 0 auto 12px;
    }

    .login-logo {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #1a7fe8, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .password-hint {
      font-size: 12.5px;
      color: var(--text-muted);
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      background: rgba(15, 20, 32, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 15px var(--blue-glow);
      background: rgba(15, 20, 32, 0.95);
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--blue), #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(26, 127, 232, 0.4);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      box-shadow: 0 6px 20px rgba(26, 127, 232, 0.6);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .error-msg {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--error);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .back-home {
      display: block;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      margin-top: 24px;
      transition: color 0.2s;
    }

    .back-home:hover {
      color: #0ea5e9;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="logo-icon.png" alt="" class="login-logo-icon">
      <div class="login-logo">Logiclic</div>
      <div class="login-subtitle">Mi Casillero</div>
    </div>

    <div class="password-hint">Ingresa con el correo con el que solicitaste tu casillero. Tu contraseña es tu número de documento.</div>

    <div class="error-msg" id="errorMsg">Correo o contraseña incorrectos.</div>

    <form id="clientLoginForm">
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Número de documento</label>
        <input type="password" id="password" placeholder="Tu número de documento" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Ingresar</button>
    </form>

    <a href="index.html" class="back-home">← Volver al sitio principal</a>
  </div>

  <script>
    document.getElementById('clientLoginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Ingresando...';

      fetch('/api/client/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
        .then((res) => res.json())
        .then((data) => {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Ingresar';
          if (data.success) {
            window.location.href = 'client-portal.html';
          } else {
            errorMsg.textContent = data.error || 'Error al iniciar sesión.';
            errorMsg.style.display = 'block';
          }
        })
        .catch((err) => {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Ingresar';
          errorMsg.textContent = 'Error de red. Inténtalo de nuevo.';
          errorMsg.style.display = 'block';
          console.error('Client login error:', err);
        });
    });
  </script>
</body>
</html>
